version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: deps
