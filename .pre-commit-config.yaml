# Pre-commit hooks for the OWASP Agentic AI (ASI01-ASI10) policy-as-code repo.
#
# Setup:
#   pip install -r requirements.txt
#   pre-commit install
#   pre-commit run --all-files
#
# CI (.github/workflows/policy-as-code.yml) is the authoritative gate.

repos:
  # Terraform hygiene (ASI03/ASI08/ASI10 infra)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # Secrets scanning (ASI03 - leaked agent credentials)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Validate agent manifests against JSON Schemas (ASI01/02/04/06/07)
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-jsonschema
        name: validate agent configs
        files: ^agents/.*\.agent\.ya?ml$
        args: ["--schemafile", "schemas/agent.schema.json"]
      - id: check-jsonschema
        name: validate tool manifests
        files: ^agents/tools/.*\.ya?ml$
        args: ["--schemafile", "schemas/tools.schema.json"]
      - id: check-jsonschema
        name: validate mcp configs
        files: ^agents/mcp/.*\.json$
        args: ["--schemafile", "schemas/mcp.schema.json"]

  # Checkov IaC scan + custom ASI policies (ASI03)
  - repo: https://github.com/bridgecrewio/checkov.git
    rev: '3.2.334'
    hooks:
      - id: checkov
        args:
          - --directory
          - terraform
          - --external-checks-dir
          - policies/checkov
          - --compact
          - --quiet

  # Semgrep agent-code rules (ASI05 RCE, ASI06 memory poisoning, ASI02 loops)
  - repo: https://github.com/semgrep/semgrep
    rev: v1.97.0
    hooks:
      - id: semgrep
        args: ["scan", "--config", "policies/semgrep/agentic.yaml", "--error", "src"]
